<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f4f8; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-danger">
    <div class="container">
        <a class="navbar-brand fw-bold">🛡️ Admin Dashboard</a>
        <a href="index.html" class="btn btn-outline-light">Logout</a>
    </div>
</nav>

<div class="container my-5">
    <h3 class="mb-4">All Complaints</h3>
    <div id="complaints"></div>
</div>

<script>
    async function loadComplaints() {
        const response = await fetch('/api/complaints/all');
        const complaints = await response.json();

        let html = '';
        complaints.forEach(c => {
            html += `
        <div class="card p-4 mb-3">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h5>${c.title}</h5>
                    <p class="mb-1"><strong>Category:</strong> ${c.category}</p>
                    <p class="mb-1"><strong>Description:</strong> ${c.description}</p>
                    <p class="mb-0"><strong>User:</strong> ${c.user ? c.user.name : 'Unknown'}</p>
                </div>
                <div class="col-md-4 text-end">
                    <span class="badge bg-warning mb-2">${c.status}</span><br>
                    <select id="status_${c.id}" class="form-select mb-2">
                        <option>Pending</option>
                        <option>In Progress</option>
                        <option>Resolved</option>
                    </select>
                    <button onclick="updateStatus(${c.id})" class="btn btn-success btn-sm">Update Status</button>
                </div>
            </div>
        </div>`;
        });
        document.getElementById('complaints').innerHTML = html || '<p>No complaints found!</p>';
    }

    async function updateStatus(id) {
        const status = document.getElementById('status_' + id).value;
        const response = await fetch('/api/complaints/status/' + id + '?status=' + status, {
            method: 'PUT'
        });
        if (response.ok) {
            alert('Status updated!');
            loadComplaints();
        }
    }

    loadComplaints();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
