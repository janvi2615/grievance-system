<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Complaint</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f4f8; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">🏛️ Citizen Grievance System</a>
        <a href="index.html" class="btn btn-outline-light">Logout</a>
    </div>
</nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4">
                <h3 class="text-center mb-4">Submit Complaint</h3>
                <div id="message"></div>
                <div class="mb-3">
                    <label>Title</label>
                    <input type="text" id="title" class="form-control" placeholder="Enter complaint title">
                </div>
                <div class="mb-3">
                    <label>Category</label>
                    <select id="category" class="form-select">
                        <option>Roads & Infrastructure</option>
                        <option>Water Supply</option>
                        <option>Electricity</option>
                        <option>Sanitation</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label>Description</label>
                    <textarea id="description" class="form-control" rows="4" placeholder="Describe your complaint"></textarea>
                </div>
                <button onclick="submitComplaint()" class="btn btn-primary w-100">Submit Complaint</button>
            </div>

            <div class="card p-4 mt-4">
                <h4>My Complaints</h4>
                <div id="complaints"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const userId = 1;

    async function submitComplaint() {
        const complaint = {
            title: document.getElementById('title').value,
            category: document.getElementById('category').value,
            description: document.getElementById('description').value
        };

        const response = await fetch('/api/complaints/submit/' + userId, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(complaint)
        });

        if (response.ok) {
            document.getElementById('message').innerHTML = '<div class="alert alert-success">Complaint submitted successfully!</div>';
            loadComplaints();
        } else {
            document.getElementById('message').innerHTML = '<div class="alert alert-danger">Failed to submit!</div>';
        }
    }

    async function loadComplaints() {
        const response = await fetch('/api/complaints/user/' + userId);
        const complaints = await response.json();

        let html = '';
        complaints.forEach(c => {
            html += `<div class="border p-3 mb-2 rounded">
            <h6>${c.title}</h6>
            <span class="badge bg-warning">${c.status}</span>
            <p class="mb-0 text-muted">${c.category}</p>
        </div>`;
        });
        document.getElementById('complaints').innerHTML = html || '<p>No complaints yet!</p>';
    }

    loadComplaints();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
